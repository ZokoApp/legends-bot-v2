<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de Venta - Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
}
.container{max-width:420px;margin:auto;padding:28px 20px;}
.card{background:rgba(255,255,255,.04);border-radius:24px;padding:26px;box-shadow:0 40px 80px rgba(0,0,0,.6);}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.top button{background:transparent;border:1px solid rgba(255,255,255,.15);color:#9ca3af;padding:6px 14px;border-radius:12px;cursor:pointer;}
.field{margin-bottom:14px;}
.field input{width:100%;padding:14px;border-radius:14px;border:none;background:#020617;color:white;}
button.main{width:100%;padding:14px;border-radius:16px;border:none;background:linear-gradient(135deg,#2563eb,#1e40af);color:white;font-weight:600;cursor:pointer;margin-top:10px;}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="top">
<h2>💰 Estado de Venta</h2>
<button onclick="location.href='index.html'">Volver</button>
</div>

<div class="field">
<input id="rut" placeholder="RUT del cliente">
</div>

<button class="main" onclick="run()">Consultar</button>

</div>
</div>

<!-- =========================
   MODO TRABAJO
========================= -->
<div id="workModal" style="display:none;position:fixed;inset:0;background:radial-gradient(circle at top,#0f172a,#020617);z-index:9999;align-items:center;justify-content:center;flex-direction:column;">
  <img src="icons/icon-192.png" style="width:90px;animation:pulse 1.4s infinite;">
  <strong style="margin-top:16px">🤖 Legends Bot trabajando</strong>
  <div id="workText" style="margin-top:10px;color:#9ca3af;font-size:.85rem"></div>
</div>

<style>
@keyframes pulse{
0%{transform:scale(.9);opacity:.6}
50%{transform:scale(1);opacity:1}
100%{transform:scale(.9);opacity:.6}
}
</style>

<!-- =========================
   MODAL RESULTADO
========================= -->
<div id="resultModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10000;align-items:center;justify-content:center;">
  <div style="background:#020617;border-radius:20px;padding:18px;width:90%;max-width:480px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Resultado</strong>
      <button onclick="closeResult()" style="background:none;border:none;color:#aaa;font-size:18px">✖</button>
    </div>

    <pre id="modalText" style="margin-top:10px"></pre>
    <img id="modalImg" style="width:100%;border-radius:12px;margin-top:10px"/>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="downloadPDF()" style="flex:1;background:#2563eb;color:white;padding:10px;border-radius:12px;border:none">📄 PDF</button>
      <button onclick="shareWhatsApp()" style="flex:1;background:#22c55e;color:white;padding:10px;border-radius:12px;border:none">📲 WhatsApp</button>
      <button onclick="closeResult()" style="flex:1;background:transparent;border:1px solid #555;color:#ccc;padding:10px;border-radius:12px">Cerrar</button>
    </div>
  </div>
</div>

<script>
const API="https://subpreputial-hypersuggestible-leonie.ngrok-free.dev";

const workMsgs=[
"Conectando con sistemas comerciales…",
"Validando RUT…",
"Consultando Andes…",
"Procesando estado de venta…",
"Generando reporte…"
];

let w=0,workTimer=null;
let lastText="", lastImg="";

function showWork(){
  workModal.style.display="flex";
  workText.innerText=workMsgs[0];
  workTimer=setInterval(()=>{
    workText.innerText=workMsgs[w++%workMsgs.length];
  },2000);
}

function hideWork(){
  workModal.style.display="none";
  clearInterval(workTimer);
}

function openResult(text,img){
  lastText=text||"";
  lastImg=img||"";
  modalText.innerText=lastText;
  modalImg.src=lastImg||"";
  resultModal.style.display="flex";
}

function closeResult(){ resultModal.style.display="none"; }

function shareWhatsApp(){
  let msg=lastText;
  if(lastImg) msg+="\n\n📸 "+lastImg;
  window.open("https://wa.me/?text="+encodeURIComponent(msg));
}

async function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF();
  const lines=pdf.splitTextToSize(lastText,180);
  pdf.text(lines,10,10);
  if(lastImg){
    const img=await fetch(lastImg).then(r=>r.blob()).then(b=>new Promise(res=>{
      const fr=new FileReader();
      fr.onload=()=>res(fr.result);
      fr.readAsDataURL(b);
    }));
    pdf.addImage(img,"PNG",10,50,180,100);
  }
  pdf.save("estado_venta_legends.pdf");
}

async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function run(){
  const rut=document.getElementById("rut").value.trim();
  if(!rut) return alert("Ingresá el RUT");

  showWork();

  const start=await fetch(API+"/estado-rut",{
    method:"POST",
    headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"true"},
    body:JSON.stringify({rut,company:"VTR"})
  });

  const data=await start.json();
  const pollUrl=API+"/estado-rut/"+data.jobId;

  while(true){
    await sleep(2000);
    const poll=await fetch(pollUrl,{headers:{"ngrok-skip-browser-warning":"true"}});
    const res=await poll.json();

    if(res.status==="queued"||res.status==="running") continue;

    if(res.status==="error"){
      hideWork();
      openResult(res.error,"");
      return;
    }

    if(res.status==="done"){
      hideWork();
      openResult(res.resultado,res.capturaUrl);
      return;
    }
  }
}
</script>

</body>
</html>
