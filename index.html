<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">

<style>
:root{
  --bg-main: radial-gradient(circle at top,#0f172a,#020617);
  --card-bg: rgba(255,255,255,.04);
  --border-soft: rgba(255,255,255,.08);
  --text-muted: #9ca3af;
}

body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:var(--bg-main);
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:28px 20px;
}

.card{
  background:var(--card-bg);
  border-radius:28px;
  padding:26px;
  box-shadow:0 50px 120px rgba(0,0,0,.65);
  backdrop-filter: blur(12px);
}

.actions-top{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-bottom:14px;
}

.actions-top button{
  background:transparent;
  border:1px solid var(--border-soft);
  color:var(--text-muted);
  padding:6px 14px;
  border-radius:14px;
  cursor:pointer;
  font-size:.75rem;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.user img{
  width:46px;
  border-radius:50%;
}

.user .name{
  font-weight:600;
  letter-spacing:.2px;
}

.user .role{
  font-size:.7rem;
  color:var(--text-muted);
}

.title{
  text-align:center;
  color:var(--text-muted);
  font-size:.7rem;
  letter-spacing:2.5px;
  margin:22px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card-btn{
  background:var(--card-bg);
  border:1px solid var(--border-soft);
  border-radius:22px;
  padding:28px 10px;
  text-align:center;
  cursor:pointer;
  transition:.25s ease;
  backdrop-filter:blur(10px);
}

.card-btn:hover{
  transform:translateY(-4px);
  box-shadow:0 35px 70px rgba(59,130,246,.25);
}

.icon{
  font-size:26px;
  margin-bottom:10px;
}

.text{
  font-weight:600;
  font-size:.9rem;
}

.status{
  margin-top:22px;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:.7rem;
  color:var(--text-muted);
}

.dot{
  width:8px;
  height:8px;
  background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 10px rgba(34,197,94,.8);
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="actions-top">
      <button onclick="location.href='historial.html'">Historial</button>
      <button onclick="logout()">Salir</button>
    </div>

    <div class="user">
      <img src="icons/icon-192.png">
      <div>
        <div class="name" id="userName"></div>
        <div class="role" id="userRole"></div>
      </div>
    </div>

    <div class="title">¿QUÉ QUERÉS HACER?</div>

    <div class="grid">
      <div class="card-btn" onclick="location.href='boleta.html'">
        <div class="icon">🧾</div>
        <div class="text">Boleta</div>
      </div>

      <div class="card-btn" onclick="location.href='estado.html'">
        <div class="icon">💰</div>
        <div class="text">Estado de Venta</div>
      </div>

      <div class="card-btn" onclick="location.href='factibilidad.html'">
        <div class="icon">🧪</div>
        <div class="text">Factibilidad</div>
      </div>

      <div class="card-btn" onclick="location.href='agenda.html'">
        <div class="icon">📅</div>
        <div class="text">Agenda</div>
      </div>
    </div>

    <div class="status">
      <div class="dot"></div>
      Conectado a Legends Bot
    </div>

  </div>
</div>

<script>
document.getElementById("userName").innerText = user.nombre;
document.getElementById("userRole").innerText = user.rol;

function logout(){
  localStorage.removeItem("legends_user");
  location.href="login.html";
}
</script>
</body>
</html>
