<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boleta - Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
}

.container{
max-width:420px;
margin:auto;
padding:28px 20px;
}

.card{
background:rgba(255,255,255,.04);
border-radius:24px;
padding:26px;
box-shadow:0 40px 80px rgba(0,0,0,.6);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.top button{
background:transparent;
border:1px solid rgba(255,255,255,.15);
color:#9ca3af;
padding:6px 14px;
border-radius:12px;
cursor:pointer;
}

h2{
margin:0;
font-size:1.1rem;
}

.field{
margin-bottom:14px;
}

.field input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#020617;
color:white;
}

button.main{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:linear-gradient(135deg,#2563eb,#1e40af);
color:white;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

.status{
margin-top:16px;
font-size:.8rem;
color:#9ca3af;
}

.result{
margin-top:20px;
background:#020617;
padding:14px;
border-radius:12px;
font-size:.8rem;
white-space:pre-wrap;
}

a.link{
display:inline-block;
margin-top:12px;
padding:12px 18px;
background:#2563eb;
color:white;
border-radius:12px;
text-decoration:none;
font-weight:600;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="top">
<h2>🧾 Boleta</h2>
<button onclick="location.href='index.html'">Volver</button>
</div>

<div class="field">
<input id="rut" placeholder="Cuenta de Facturacion">
</div>

<button class="main" onclick="run()">Buscar Boleta</button>

<div class="status" id="status">Conectado a Legends Bot</div>
<div class="result" id="result"></div>

</div>
</div>

<script>
const API = "https://subpreputial-hypersuggestible-leonie.ngrok-free.dev";

async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function run(){
  const rut = document.getElementById("rut").value.trim();
  if(!rut) return alert("Ingresá Cuenta de Facturacion");

  status.innerText = "⏳ Enviando solicitud...";
  result.innerText = "";

  const start = await fetch(API + "/boleta", {
    method:"POST",
    headers:{ "Content-Type":"application/json","ngrok-skip-browser-warning":"true" },
    body: JSON.stringify({ rut, company:"VTR" })
  });

  const data = await start.json();
  const pollUrl = API + "/boleta/" + data.jobId;

  status.innerText = "🟡 Buscando boleta...";

  while(true){
    await sleep(2000);
    const poll = await fetch(pollUrl,{headers:{"ngrok-skip-browser-warning":"true"}});
    const res = await poll.json();

    if(res.status==="queued" || res.status==="running") continue;

    if(res.status==="error"){
      status.innerText="🔴 Error";
      result.innerText=res.error;
      return;
    }

    if(res.status==="done"){
      status.innerText="🟢 Finalizado";

      if(res.pdfUrl){
        result.innerHTML = `
          <p>Boleta disponible:</p>
          <a class="link" href="${res.pdfUrl}" target="_blank">Abrir PDF</a>
        `;
      } else {
        result.innerText = res.mensaje || "No hay boleta disponible";
      }
      return;
    }
  }
}
</script>

  <!-- MODO TRABAJO -->
<div id="workModal" style="display:none;position:fixed;inset:0;background:radial-gradient(circle at top,#0f172a,#020617);z-index:9999;align-items:center;justify-content:center;flex-direction:column;">
  <img src="icons/icon-192.png" style="width:90px;animation:pulse 1.4s infinite;">
  <strong style="margin-top:16px">🤖 Legends Bot trabajando</strong>
  <div id="workText" style="margin-top:10px;color:#9ca3af;font-size:.85rem"></div>
</div>

<style>
@keyframes pulse{
0%{transform:scale(.9);opacity:.6}
50%{transform:scale(1);opacity:1}
100%{transform:scale(.9);opacity:.6}
}
</style>

<!-- MODAL RESULTADO -->
<div id="resultModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10000;align-items:center;justify-content:center;">
  <div style="background:#020617;border-radius:20px;padding:18px;width:90%;max-width:480px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Resultado</strong>
      <button onclick="closeResult()" style="background:none;border:none;color:#aaa;font-size:18px">✖</button>
    </div>

    <pre id="modalText" style="margin-top:10px"></pre>
    <img id="modalImg" style="width:100%;border-radius:12px;margin-top:10px"/>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="downloadPDF()" style="flex:1;background:#2563eb;color:white;padding:10px;border-radius:12px;border:none">📄 PDF</button>
      <button onclick="shareWhatsApp()" style="flex:1;background:#22c55e;color:white;padding:10px;border-radius:12px;border:none">📲 WhatsApp</button>
      <button onclick="closeResult()" style="flex:1;background:transparent;border:1px solid #555;color:#ccc;padding:10px;border-radius:12px">Cerrar</button>
    </div>
  </div>
</div>

</body>
</html>
