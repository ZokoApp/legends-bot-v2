<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boleta - Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
:root{
  --bg-main: radial-gradient(circle at top,#0f172a,#020617);
  --card-bg: rgba(255,255,255,.04);
  --border-soft: rgba(255,255,255,.1);
  --text-muted:#9ca3af;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:var(--bg-main);
  color:white;
}

.screen{
  max-width:420px;
  margin:auto;
  padding:28px 20px;
}

.card{
  background:var(--card-bg);
  border-radius:28px;
  padding:26px;
  box-shadow:0 50px 120px rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
}

/* HEADER */
.header{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:36px;
}

.header h1{
  margin:0;
  font-size:1.4rem;
  font-weight:600;
}

.header p{
  margin:4px 0 0;
  font-size:.75rem;
  color:var(--text-muted);
}

.back{
  background:rgba(255,255,255,.05);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:6px 10px;
  color:var(--text-muted);
  cursor:pointer;
}

/* BODY */
.body{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.label{
  font-size:.75rem;
  color:var(--text-muted);
}

.input{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-soft);
  border-radius:16px;
  padding:16px;
  font-size:1rem;
  color:white;
  outline:none;
}

.primary{
  margin-top:10px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:.95rem;
  font-weight:600;
  color:white;
  cursor:pointer;
}

/* MODALS */
#workModal,#resultModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
}

#workModal{
  background:var(--bg-main);
  flex-direction:column;
}

#workModal img{
  width:90px;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%{transform:scale(.9);opacity:.6}
  50%{transform:scale(1);opacity:1}
  100%{transform:scale(.9);opacity:.6}
}

#resultModal{
  background:rgba(0,0,0,.85);
}

.result-card{
  background:#020617;
  border-radius:22px;
  padding:20px;
  width:90%;
  max-width:480px;
}

.result-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.result-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.result-actions button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;
}

.btn-pdf{background:#2563eb;color:white}
.btn-wa{background:#22c55e;color:white}
.btn-close{background:transparent;border:1px solid #555;color:#ccc}

#btnVerBoleta{
  display:none;
  width:100%;
  margin-top:16px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:.95rem;
  font-weight:600;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="screen">
  <div class="card">
    <div class="header">
      <button class="back" onclick="location.href='index.html'">← Volver</button>
      <div>
        <h1>Boleta</h1>
        <p>Buscar boleta por cuenta de facturación</p>
      </div>
    </div>

    <div class="body">
      <label class="label">Cuenta de facturación</label>
      <input id="rut" class="input" placeholder="Ej: 12345678">
      <button class="primary" onclick="run()">Buscar Boleta</button>
    </div>
  </div>
</div>

<div id="workModal">
  <img src="icons/icon-192.png">
  <strong style="margin-top:16px">Legends Bot trabajando</strong>
  <div id="workText" style="margin-top:10px;color:#9ca3af;font-size:.85rem"></div>
</div>

<div id="resultModal">
  <div class="result-card">
    <div class="result-top">
      <strong>Resultado</strong>
      <button onclick="closeResult()" style="background:none;border:none;color:#aaa;font-size:18px">✖</button>
    </div>

    <pre id="modalText" style="margin-top:10px"></pre>

    <button id="btnVerBoleta" onclick="verBoleta()">🔎 Ver boleta</button>

    <div class="result-actions">
      <button class="btn-pdf" onclick="downloadPDF()">PDF</button>
      <button class="btn-wa" onclick="shareWhatsApp()">WhatsApp</button>
      <button class="btn-close" onclick="closeResult()">Cerrar</button>
    </div>
  </div>
</div>

<script>
const API="https://unreproached-subangularly-cristopher.ngrok-free.dev";

const workMsgs=[
"Conectando con sistemas corporativos…",
"Autenticando credenciales…",
"Consultando Andes…",
"Procesando información…",
"Generando boleta…"
];

let workI=0,workTimer=null;
let lastText="", lastImg="", lastLink="";

function showWork(){
  workModal.style.display="flex";
  workText.innerText=workMsgs[0];
  workTimer=setInterval(()=>{
    workText.innerText=workMsgs[workI++%workMsgs.length];
  },2000);
}

function hideWork(){
  workModal.style.display="none";
  clearInterval(workTimer);
}

function openResult(text,img){
  lastText=text||"";
  lastImg=img||"";
  lastLink="";

  modalText.innerText="";
  btnVerBoleta.style.display="none";

  if(lastText.startsWith("http")){
    lastLink=lastText;
    modalText.innerText="Boleta disponible";
    btnVerBoleta.style.display="block";
  }else{
    modalText.innerText=lastText;
  }

  resultModal.style.display="flex";
}

function verBoleta(){
  if(lastLink) window.open(lastLink,"_blank");
}

function closeResult(){
  resultModal.style.display="none";
}

function shareWhatsApp(){
  let msg=lastText;
  if(lastLink) msg+="\n"+lastLink;
  window.open("https://wa.me/?text="+encodeURIComponent(msg));
}

async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function run(){
  const rut=document.getElementById("rut").value.trim();
  if(!rut) return alert("Ingresá la cuenta");

  showWork();

  const start=await fetch(API+"/boleta",{
    method:"POST",
    headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"true"},
    body:JSON.stringify({rut,company:"VTR"})
  });

  const data=await start.json();
  const pollUrl=API+"/boleta/"+data.jobId;

  while(true){
    await sleep(2000);
    const poll=await fetch(pollUrl,{headers:{"ngrok-skip-browser-warning":"true"}});
    const res=await poll.json();

    if(res.status==="queued"||res.status==="running") continue;

    hideWork();

    if(res.status==="error"){
      openResult(res.error,"");
      return;
    }

    if(res.status==="done"){
      openResult(res.pdfUrl || res.mensaje || res.resultado,"");
      return;
    }
  }
}
</script>

</body>
</html>
