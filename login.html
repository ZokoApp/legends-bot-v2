<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Legends Bot · Acceso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.06);
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 36px 28px 30px;
      box-shadow: 0 2px 40px rgba(0,0,0,0.5);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .login-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .login-logo img {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #020617;
      object-fit: cover;
      border: 2px solid rgba(37,99,235,0.35);
      box-shadow: 0 0 0 6px rgba(37,99,235,0.08);
      animation: logoIn 0.5s ease;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: #475569;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 13px 14px 13px 38px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.08);
      background: #020617;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: rgba(37,99,235,0.6);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .field input::placeholder {
      color: #334155;
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
      background: #2563eb;
      color: #fff;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover  { background: #1d4ed8; }
    .btn:active { transform: scale(0.98); }

    .error {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #f87171;
      text-align: center;
      display: none;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.68rem;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>

<body>
<div class="login-card">
  <div class="logo">Legends Bot</div>
  <div class="subtitle">Acceso interno autorizado</div>

  <div class="login-logo">
    <img src="icons/icon-192.png" alt="Logo">
  </div>

  <div class="field">
    <label>Email</label>
    <div class="input-wrap">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
      <input id="email" type="email" placeholder="usuario@legendsbot.com">
    </div>
  </div>

  <div class="field">
    <label>Contraseña</label>
    <div class="input-wrap">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="password" type="password" placeholder="••••••••">
    </div>
  </div>

  <button class="btn" onclick="login()">Ingresar</button>

  <div id="error" class="error"></div>

  <div class="footer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Legends Bot · Sistema interno
  </div>
</div>

<script>
const LOGIN_API = "https://unreproached-subangularly-cristopher.ngrok-free.dev/login";

async function login() {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();
  const errorBox = document.getElementById("error");

  errorBox.style.display = "none";
  errorBox.innerText = "";

  if (!email || !password) return showError("Completá todos los campos");

  try {
    const res = await fetch(LOGIN_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!data.ok) return showError(data.error || "Acceso denegado");
    localStorage.setItem("legends_user", JSON.stringify(data.user));
    window.location.href = "index.html";
  } catch (err) {
    showError("Error de conexión con la API");
  }
}

function showError(msg) {
  const errorBox = document.getElementById("error");
  errorBox.innerText = msg;
  errorBox.style.display = "block";
}
</script>
</body>
</html>
