
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factibilidad - Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#0f172a,#020617);
color:white;
}

.container{max-width:420px;margin:auto;padding:28px 20px;}
.card{background:rgba(255,255,255,.04);border-radius:24px;padding:26px;box-shadow:0 40px 80px rgba(0,0,0,.6);}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.top button{
background:transparent;
border:1px solid rgba(255,255,255,.15);
color:#9ca3af;
padding:6px 14px;
border-radius:12px;
cursor:pointer;
}

.field{margin-bottom:14px;}
.field input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#020617;
color:white;
}

button.main{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:linear-gradient(135deg,#2563eb,#1e40af);
color:white;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

.status{margin-top:16px;font-size:.8rem;color:#9ca3af;}
.result{
margin-top:20px;
background:#020617;
padding:14px;
border-radius:12px;
font-size:.8rem;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="top">
<h2>🧪 Factibilidad Técnica</h2>
<button onclick="location.href='index.html'">Volver</button>
</div>

<div class="field">
<input id="direccion" placeholder="Dirección">
</div>

<div class="field">
<input id="comuna" placeholder="Comuna">
</div>

<button class="main" onclick="run()">Consultar</button>

<div class="status" id="status">Conectado a Legends Bot</div>
<div class="result" id="result"></div>

</div>
</div>

<script>
const API = "https://subpreputial-hypersuggestible-leonie.ngrok-free.dev";

async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function run(){
  const direccion = document.getElementById("direccion").value.trim();
  const comuna = document.getElementById("comuna").value.trim();

  if(!direccion || !comuna) return alert("Completá dirección y comuna");

  status.innerText = "⏳ Consultando...";
  result.innerText = "";

  const start = await fetch(API + "/factibilidad", {
    method:"POST",
    headers:{ "Content-Type":"application/json","ngrok-skip-browser-warning":"true" },
    body: JSON.stringify({ direccion, comuna, company:"VTR", email:user.email })
  });

  const data = await start.json();
  const pollUrl = API + "/factibilidad/" + data.jobId;

  status.innerText = "🟡 Procesando...";

  while(true){
    await sleep(2000);
    const poll = await fetch(pollUrl,{headers:{"ngrok-skip-browser-warning":"true"}});
    const res = await poll.json();

    if(res.status==="queued" || res.status==="running") continue;

    if(res.status==="error"){
      status.innerText="🔴 Error";
      result.innerText=res.error;
      return;
    }

    if(res.status==="done"){
      status.innerText="🟢 Finalizado";
      result.innerText = res.resultado || "Sin datos";
      return;
    }
  }
}
</script>

</body>
</html>
