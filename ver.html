<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado - Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
:root{
  --bg-main: radial-gradient(circle at top,#0f172a,#020617);
  --card-bg: rgba(255,255,255,.04);
  --border-soft: rgba(255,255,255,.1);
  --text-muted:#9ca3af;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:var(--bg-main);
  color:white;
}

.screen{
  max-width:420px;
  margin:auto;
  padding:28px 20px;
}

.card{
  background:var(--card-bg);
  border-radius:28px;
  padding:26px;
  box-shadow:0 50px 120px rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
}

.header{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:24px;
}

.back{
  background:rgba(255,255,255,.05);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:6px 10px;
  color:var(--text-muted);
  cursor:pointer;
}

h1{
  margin:0;
  font-size:1.4rem;
}

small{
  color:var(--text-muted);
}

.result{
  margin-top:18px;
  white-space:pre-wrap;
  font-size:.9rem;
  line-height:1.4;
}

img{
  width:100%;
  border-radius:14px;
  margin-top:14px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.actions button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:600;
}

.btn-main{
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:white;
}

.btn-wa{
  background:#22c55e;
  color:white;
}

.btn-back{
  background:transparent;
  border:1px solid #555;
  color:#ccc;
}
</style>
</head>

<body>

<div class="screen">
  <div class="card">

    <div class="header">
      <button class="back" onclick="volver()">← Historial</button>
      <div>
        <h1 id="titulo">Resultado</h1>
        <small id="fecha"></small>
      </div>
    </div>

    <div id="resultado" class="result"></div>
    <img id="imagen" style="display:none">

    <div class="actions">
      <button id="btnVer" class="btn-main" style="display:none" onclick="verLink()">🔎 Ver</button>
      <button class="btn-wa" onclick="shareWhatsApp()">WhatsApp</button>
    </div>

    <div class="actions">
      <button class="btn-back" onclick="volver()">Cerrar</button>
    </div>

  </div>
</div>

<script>
/* =========================
   CARGA SEGURA DE DATOS
========================= */
const raw = localStorage.getItem("last_result");

if(!raw){
  document.getElementById("resultado").innerText = "No hay resultado para mostrar.";
}else{
  let data;
  try{
    data = JSON.parse(raw);
  }catch(e){
    document.getElementById("resultado").innerText = "Error leyendo resultado.";
    throw e;
  }

  document.getElementById("titulo").innerText = (data.tipo || "Resultado").toUpperCase();
  document.getElementById("fecha").innerText  = data.fecha || "";

  const resEl = document.getElementById("resultado");
  const imgEl = document.getElementById("imagen");
  const btnVer = document.getElementById("btnVer");

  let link = "";

  if(data.resultado && typeof data.resultado === "string" && data.resultado.startsWith("http")){
    link = data.resultado;
    resEl.innerText = "Resultado disponible";
    btnVer.style.display = "block";
  }else{
    resEl.innerText = data.resultado || "Sin resultado";
  }

  if(data.captura){
    imgEl.src = data.captura;
    imgEl.style.display = "block";
  }

  window.verLink = function(){
    if(link) window.open(link,"_blank");
  }

  window.shareWhatsApp = function(){
    let msg = data.resultado || "";
    if(link) msg += "\n" + link;
    window.open("https://wa.me/?text="+encodeURIComponent(msg));
  }
}

function volver(){
  location.href="historial.html";
}
</script>

</body>
</html>
