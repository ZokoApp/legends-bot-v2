<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicio Finalizado</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        .card {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.4);
        }

        .logo {
            width: 120px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 20px;
            color: #00d9ff;
        }

        p {
            font-size: 20px;
            margin: 15px 0;
        }

        .highlight {
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Logo Computación (Laptop SVG) -->
        <svg class="logo" viewBox="0 0 64 64" fill="#00d9ff" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="12" width="48" height="30" rx="3" ry="3" stroke="#00d9ff" stroke-width="2" fill="none"/>
            <rect x="4" y="44" width="56" height="6" rx="2" fill="#00d9ff"/>
        </svg>

        <h1>Gracias por usar nuestro servicio</h1>

        <p class="highlight">Servicio Legends Bot Finalizado</p>

        <p>Les deseamos lo mejor en sus futuros proyectos.</p>

    </div>

</body>
</html>
