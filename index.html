<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legends Bot</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    color:white;
}

.box{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.icon{
    font-size:52px;
    margin-bottom:15px;
}

h2{
    margin:0 0 12px;
}

p{
    color:#cbd5e1;
    line-height:1.5;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:15px;
}
</style>
</head>
<body>

<div class="box">
    <div class="icon">⚠️</div>

    <h2>⚠️ API Desactualizada</h2>

<p>
    Se detectó una versión antigua de la API.
    <br><br>
    La versión actual de la aplicación no es compatible con los servicios requeridos.
    Por favor, actualice la aplicación e inténtelo nuevamente.
</p>
    <button onclick="location.reload()">
        Reintentar
    </button>
</div>

</body>
</html>
