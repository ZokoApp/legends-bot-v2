<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial - Legends Bot</title>

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
:root{
  --bg-main: radial-gradient(circle at top,#0f172a,#020617);
  --card-bg:#020617;
  --text-muted:#9ca3af;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:var(--bg-main);
  color:white;
}

.container{
  max-width:480px;
  margin:auto;
  padding:20px;
}

h2{margin-bottom:12px;}

.back{
  background:transparent;
  border:1px solid rgba(255,255,255,.15);
  color:#9ca3af;
  padding:6px 14px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:14px;
}

.item{
  background:var(--card-bg);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  font-size:.85rem;
}

.item small{color:var(--text-muted);}
.badge{
  display:inline-block;
  font-size:.65rem;
  padding:3px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  margin-top:4px;
}

.item button{
  margin-top:10px;
  margin-right:6px;
  padding:6px 10px;
  border-radius:10px;
  border:none;
  background:#2563eb;
  color:white;
  font-size:.75rem;
  cursor:pointer;
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:9999;
  align-items:center;
  justify-content:center;
}

.modal-card{
  background:#020617;
  border-radius:18px;
  padding:18px;
  width:90%;
  max-width:480px;
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.modal-actions button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

.btn-primary{background:#2563eb;color:white}
.btn-green{background:#22c55e;color:white}
.btn-close{background:transparent;border:1px solid #555;color:#ccc}
</style>
</head>

<body>

<div class="container">
  <h2>📜 Historial</h2>
  <button class="back" onclick="location.href='index.html'">⬅ Volver</button>
  <div id="list"></div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-card">
    <div class="modal-top">
      <strong>Resultado</strong>
      <button onclick="closeModal()" style="background:none;border:none;color:#aaa;font-size:18px">✖</button>
    </div>

    <pre id="modalText" style="margin-top:10px"></pre>

    <div class="modal-actions">
      <button id="btnLink" class="btn-primary" style="display:none" onclick="openLink()">🔎 Ver boleta</button>
      <button class="btn-close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>
</div>

<script>
const list = document.getElementById("list");
const history = JSON.parse(localStorage.getItem("legends_history") || "[]");

let currentLink="";

if(history.length === 0){
  list.innerHTML = "<p>No hay consultas aún</p>";
}

history.forEach((h,i)=>{
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <strong>${h.tipo.toUpperCase()}</strong><br>
    <small>${h.fecha}</small><br>
    <span class="badge">Empresa: ${h.company || "VTR"}</span><br>
    <pre>${(h.resultado || "").slice(0,120)}...</pre>
    <button onclick="ver(${i})">Ver</button>
    <button onclick="repeat(${i})">Repetir</button>
  `;
  list.appendChild(div);
});

function ver(i){
  const h = history[i];
  const txt = h.resultado || "";
  modalText.innerText="";
  btnLink.style.display="none";
  currentLink="";

  if(typeof txt==="string" && txt.startsWith("http")){
    modalText.innerText="Boleta disponible";
    currentLink=txt;
    btnLink.style.display="block";
  }else{
    modalText.innerText=txt;
  }

  modal.style.display="flex";
}

function openLink(){
  if(currentLink) window.open(currentLink,"_blank");
}

function closeModal(){
  modal.style.display="none";
}

function repeat(i){
  const h = history[i];
  localStorage.setItem("legends_company", h.company || "VTR");

  if(h.tipo==="boleta") location.href="boleta.html?rut="+h.datos.rut;
  if(h.tipo==="estado") location.href="estado.html?rut="+h.datos.rut;
  if(h.tipo==="agenda") location.href="agenda.html?rut="+h.datos.rut;
  if(h.tipo==="factibilidad"){
    location.href="factibilidad.html?direccion="
      +encodeURIComponent(h.datos.direccion)
      +"&comuna="+encodeURIComponent(h.datos.comuna);
  }
}
</script>

</body>
</html>
