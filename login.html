<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restauración del Sistema</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #1c1c1c;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 120, 0.4);
            max-width: 500px;
        }
        .logo {
            width: 120px;
            margin-bottom: 25px;
        }
        h1 {
            color: #00ff88;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <img 
            src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Vercel_logo_black.svg" 
            alt="Vercel Logo" 
            class="logo"
        >

        <h1>✔ Sistema Restaurado</h1>
        <p>El acceso al proyecto ha sido restablecido.</p>
        <p><strong>Contacte al administrador</strong> para más información.</p>
    </div>
</body>
</html>
