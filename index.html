<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legends Bot</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">

<script>
const user = JSON.parse(localStorage.getItem("legends_user"));
if (!user) location.href="login.html";
</script>

<style>
body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#0f172a,#020617);
color:#e5e7eb;
}
.container{max-width:420px;margin:auto;padding:20px}
.card{background:rgba(255,255,255,.04);border-radius:20px;padding:20px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.mode-card{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.1);
border-radius:18px;
padding:22px;
color:white;
text-align:center;
cursor:pointer;
}
.mode-card.active{border-color:#3b82f6}
.field{margin-bottom:14px}
.field input, select{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#020617;
color:white;
}
button{padding:14px;width:100%;border-radius:16px;border:none;background:#2563eb;color:white}
</style>
</head>

<body>
<div class="container">
<div class="card">

<div style="margin-bottom:15px">
<strong id="userName"></strong>
</div>

<select id="company">
<option value="VTR">VTR</option>
<option value="CLARO">CLARO</option>
</select>

<div class="mode-grid">
<div class="mode-card" onclick="selectMode('boleta')">🧾 Boleta</div>
<div class="mode-card" onclick="selectMode('validacion')">💰 Estado de Venta</div>
<div class="mode-card" onclick="selectMode('factibilidad')">🧪 Factibilidad</div>
<div class="mode-card" onclick="selectMode('agenda')">📅 Agenda</div>
</div>

<input type="hidden" id="mode">

<div id="fieldDireccion" class="field" style="display:none">
<input id="address" placeholder="Dirección">
</div>

<div id="fieldComuna" class="field" style="display:none">
<input id="comuna" placeholder="Comuna">
</div>

<div id="fieldRut" class="field" style="display:none">
<input id="rut" placeholder="RUT">
</div>

<button id="btnRun">Ejecutar</button>

</div>
</div>

<script src="app.js"></script>

<script>
document.getElementById("userName").innerText = user.nombre;

function selectMode(m){
document.querySelectorAll(".mode-card").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
mode.value = m;

fieldDireccion.style.display = (m==="factibilidad")?"block":"none";
fieldComuna.style.display = (m==="factibilidad")?"block":"none";
fieldRut.style.display = (m!=="factibilidad")?"block":"none";
}
</script>

</body>
</html>
