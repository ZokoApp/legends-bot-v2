<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Servicio no disponible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .message {
      text-align: center;
      background: white;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 400px;
    }

    p {
      margin: 0;
      color: #333;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="message">
    <p>
      Error en un sistema externo. El servicio no se encuentra disponible temporalmente.
    </p>
  </div>
</body>
</html>
